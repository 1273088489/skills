# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- insert:
    - id: mcp-tavily
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: tavily
        url: 'https://mcp.tavily.com/mcp/?tavilyApiKey=REPLACE_ME'
        headers: {}
        toolCallTimeoutMs: 60000
        failOnStartupError: false
# Conservative boot for DSH 0.1.5-rc.1: these two have no 0.1.5-aligned
# release (panel/Agent API risk). Re-enable after they publish a matching build.
- id: ui-chat-recovery
  disabled: true
- id: desktop-launcher
  disabled: true
# (archive-manager is not installed and web-all no longer bundles it, so no
# disable row is needed here; re-add one only if that plugin is installed.)
